<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register- Whale</title>
    <!-- Cart CSS -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="bootstrapicons/bootstrap-icons.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header id="header"></header>

<section class="login-banner">
    <img src="images/banners/login.png" alt="Whale Jewelry">
</section>


<!-- ================= MAIN ================= -->

<main class="login-container">

    <!-- Breadcrumb -->

    <div class="breadcrumb">
        <i class="bi bi-house-fill"></i>

        <span>TRANG CHỦ</span>

        <span>/</span>

        <span>ĐĂNG NHẬP TÀI KHOẢN</span>
    </div>


    <div class="row login-content">

        <!-- ================= LOGIN ================= -->

        <div class="col-lg-6 login-form-section">

            <h1>Đăng ký tài khoản</h1>

            <p class="description">
                Đăng ký bằng username và mật khẩu của riêng bạn.
            </p>

            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="username">
                        Username <span>*</span>
                    </label>

                    <input
                        type="username"
                        id="username"
                        name="username"
                        placeholder="Username..."
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Mật khẩu <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mật khẩu"
                        required>

                </div>


                <!-- Error -->

                <p id="loginMessage" class="login-message"></p>


                <!-- Button -->

                <div class="login-actions">

                    <button type="submit" class="btn-login">
                        Đăng ký
                    </button>

                </div>

            </form>

        </div>


        <!-- ================= FORGOT PASSWORD ================= -->

        <div class="col-lg-6 forgot-section">


        </div>

    </div>

</main>






    <!-- ================= FOOTER ================= -->
    <footer id="footer"></footer>
    <script>
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                // Báo cho index.js biết header đã load xong
                document.dispatchEvent(new Event("headerLoaded"));
            });


        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>



    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    


    <!-- ================= JS ================= -->

</body>

</html>
