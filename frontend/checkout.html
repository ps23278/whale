<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout- Whale</title>
    <!-- Cart CSS -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="bootstrapicons/bootstrap-icons.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header id="header"></header>

    <main class="checkout-container">
        <div class="container py-5">
            <h1 class="checkout-title mb-4"> Thanh toán </h1>
            <div class="row g-4"> <!-- ================= LEFT ================= -->
                <div class="col-lg-8"> <!-- ĐỊA CHỈ GIAO HÀNG -->
                    <section class="checkout-box">
                        <form id="checkoutForm">
                            


                            <div class="mb-3"> <label for="address" class="form-label"> Địa chỉ </label> <textarea
                                    id="address" class="form-control" rows="3" placeholder="Nhập địa chỉ giao hàng"
                                    required></textarea> </div>
                            <div class="mb-3">
                                <label class="form-label">Phương thức thanh toán</label>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="cod"
                                        value="COD" checked>

                                    <label class="form-check-label" for="cod">
                                        Thanh toán khi nhận hàng (COD)
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="banking"
                                        value="BANKING">

                                    <label class="form-check-label" for="banking">
                                        Chuyển khoản ngân hàng
                                    </label>
                                </div>
                            </div>
                        </form>
                    </section> <!-- SẢN PHẨM -->
                    <section class="checkout-box">
                        <h3 class="section-title"> <i class="bi bi-bag"></i> Sản phẩm trong giỏ </h3>
                        <div id="checkoutItems"> <!-- JavaScript sẽ render sản phẩm tại đây --> </div>
                    </section>
                </div> <!-- ================= RIGHT ================= -->
                <div class="col-lg-4">
                    <section class="checkout-box order-summary">
                        <h3 class="section-title"> Đơn hàng </h3>
                        <div class="summary-row"> <span>Tạm tính</span> <span id="subtotal">0 ₫</span> </div>
                        <div class="summary-row"> <span>Phí vận chuyển</span> <span id="shippingFee">0 ₫</span> </div>
                        <hr>
                        <div class="summary-total"> <span>Tổng tiền</span> <strong id="totalAmount"> 0 ₫ </strong>
                        </div> <button type="button" id="btnPlaceOrder" class="btn btn-dark w-100 mt-4"> Đặt hàng
                        </button>
                    </section>
                </div>
            </div>
        </div>
    </main>


    <!-- ================= FOOTER ================= -->
    <footer id="footer"></footer>
    <script>
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                // Báo cho index.js biết header đã load xong
                document.dispatchEvent(new Event("headerLoaded"));
            });


        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>
    <script src="js/checkout.js"></script>



    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>


    <!-- ================= JS ================= -->

</body>

</html>
