<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giỏ hàng - Whale</title>
    <!-- Cart CSS -->
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="bootstrapicons/bootstrap-icons.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header id="header"></header>


    <!-- ================= BREADCRUMB ================= -->
    <div class="breadcrumb-area">
        <div class="container">
            <span>Trang chủ</span>
            <span class="separator">/</span>
            <span class="current">Giỏ hàng (<span id="cartCount">0</span>)</span>
        </div>
    </div>


    <!-- ================= CART ================= -->
    <main class="cart-page">

        <!-- TITLE -->
        <section class="cart-title">
            <h1>Giỏ hàng của bạn</h1>

            <p>
                Có <span id="cartProductCount">0</span> sản phẩm trong giỏ hàng
            </p>

            <div class="title-line"></div>
        </section>


        <!-- CART CONTENT -->
        <section class="cart-content">

            <div class="container">

                <div class="row g-4">

                    <!-- ================= LEFT ================= -->
                    <div class="col-lg-8">

                        <!-- CART PRODUCTS -->
                        <div id="cartItems">

                            <!--
                        JavaScript sẽ render sản phẩm vào đây.

                        Ví dụ:

                        <div class="cart-item">
                            ...
                        </div>
                        -->

                        </div>


                        <!-- EMPTY CART -->
                        <div id="emptyCart" class="emp  ty-cart">
                            <p>Giỏ hàng của bạn đang trống</p>
                        </div>

                    </div>


                    <!-- ================= RIGHT ================= -->
                    <div class="col-lg-4">

                        <div class="order-summary">

                            <h2>Thông tin đơn hàng</h2>

                            <div class="summary-line"></div>


                            <!-- TOTAL -->
                            <div class="summary-row">

                                <span>Tổng tiền:</span>

                                <strong id="cartTotal">
                                    0₫
                                </strong>

                            </div>


                            <!-- NOTE -->
                            <div class="summary-note">

                                <p>
                                    Phí vận chuyển sẽ được tính ở trang thanh toán.
                                </p>

                                <p>
                                    Bạn cũng có thể nhập mã giảm giá ở trang thanh toán.
                                </p>

                            </div>


                            <!-- CHECKOUT -->
                            <button id="checkoutBtn" class="checkout-btn" disabled>

                                THANH TOÁN

                            </button>


                            <!-- CONTINUE SHOPPING -->
                            <a href="index.html" class="continue-shopping">

                                <i class="bi bi-arrow-left"></i>

                                Tiếp tục mua hàng

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer id="footer"></footer>
      <script>
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                // Báo cho index.js biết header đã load xong
                document.dispatchEvent(new Event("headerLoaded"));
            });


        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>


    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>


    <!-- ================= JS ================= -->
    <script src="js/cart.js"></script>

</body>

</html>
