<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Whale Admin - Products</title>

    <link rel="stylesheet" href="css/productadmin.css">
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="page-header">

        <h1>Products</h1>

        <button id="addProductBtn" class="btn-add">
            + Add Product
        </button>

    </div>


    <!-- Search -->
    <div class="toolbar">

        <input
                type="text"
                id="searchInput"
                placeholder="Search product..."
        >

        <select id="categoryFilter">
            <option value="">All Categories</option>
        </select>

    </div>


    <!-- Product table -->
    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="productTableBody">

            <!-- Products will be loaded here -->

            </tbody>

        </table>

    </div>

</div>


<!-- Add / Edit Product Modal -->

<div id="productModal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Product</h2>

        <form id="productForm">

            <input type="hidden" id="productId">


            <label>Product Name</label>

            <input
                    type="text"
                    id="productName"
                    required
            >


            <label>Price</label>

            <input
                    type="number"
                    id="productPrice"
                    required
            >


            <label>Quantity</label>

            <input
                    type="number"
                    id="productQuantity"
                    required
            >


            <label>Description</label>

            <textarea
                    id="productDescription"
            ></textarea>


            <label>Brand</label>

            <select id="productBrand">
                <option value="">Select Brand</option>
            </select>


            <div class="modal-actions">

                <button
                        type="button"
                        id="cancelBtn"
                        class="btn-cancel"
                >
                    Cancel
                </button>

                <button
                        type="submit"
                        class="btn-save"
                >
                    Save
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/productadmin.js"></script>

</body>
</html>
