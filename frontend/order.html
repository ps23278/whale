<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout- Whale</title>
    <!-- Cart CSS -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="bootstrapicons/bootstrap-icons.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    <!-- <link rel="stylesheet" href="css/order.css"> -->
</head>

<body>

    <!-- header -->
    <header id="header"></header>

        <main class="order-page">
    <div class="container py-5">

        <!-- TITLE -->
        <div class="order-title text-center mb-5">
            <h1>Đơn hàng của tôi</h1>
            <p class="text-muted">
                Theo dõi các đơn hàng bạn đã đặt tại Whale
            </p>
        </div>

        <!-- ORDER LIST -->
        <div id="orderList">

            <!-- Order sẽ được JS render vào đây -->

        </div>

        <!-- EMPTY -->
        <div id="emptyOrder" class="text-center py-5 d-none">
            <i class="bi bi-box-seam fs-1"></i>

            <h4 class="mt-3">
                Bạn chưa có đơn hàng nào
            </h4>

            <p class="text-muted">
                Hãy khám phá các sản phẩm của Whale.
            </p>

            <a href="index.html" class="btn btn-dark">
                Tiếp tục mua sắm
            </a>
        </div>

    </div>
</main>
 <!-- footer -->
    <footer id="footer"></footer>
    <script>
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                // Báo cho index.js biết header đã load xong
                document.dispatchEvent(new Event("headerLoaded"));
            });


        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>
    <script src="js/order.js"></script>



    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>


    <!-- ================= JS ================= -->

</body>

</html>
